openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
paths:
  /packaging/batches/{batchId}/documents/scanner-health:
    get:
      operationId: getPackagingScannerHealth
      summary: Scanner availability and quarantine metadata for evidence accessible to this account
      parameters:
        - { name: batchId, in: path, required: true, schema: { type: string, minLength: 1, maxLength: 100 } }
      responses:
        "200":
          description: Operational metadata only; probe history is since this server started
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PackagingScannerHealth" }
        "400": { description: Invalid batch }
        "401": { description: Login required }
        "503": { description: Health could not be loaded }
  /packaging/teams/{teamId}/access-history:
    get:
      operationId: listEvidenceTeamAccessHistory
      summary: Membership changes visible only to the current team owner
      parameters:
        - { name: teamId, in: path, required: true, schema: { type: string } }
        - { name: before, in: query, schema: { type: integer, minimum: 1 } }
      responses:
        "200":
          description: Newest changes first; no inferred pre-tracking history
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EvidenceAccessHistory" }
        "401": { description: Login required }
        "404": { description: Team unavailable or not owned }
  /packaging/batches/{batchId}/documents/{documentId}/access-history:
    get:
      operationId: listEvidenceDocumentAccessHistory
      summary: Sharing changes visible only to the uploader
      parameters:
        - { name: batchId, in: path, required: true, schema: { type: string } }
        - { name: documentId, in: path, required: true, schema: { type: string } }
        - { name: before, in: query, schema: { type: integer, minimum: 1 } }
      responses:
        "200":
          description: Newest changes first; no inferred pre-tracking history
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EvidenceAccessHistory" }
        "401": { description: Login required }
        "404": { description: Document unavailable or not uploaded by this account }
  /packaging/batches/{id}/allocation-history:
    get:
      operationId: listPackagingAllocationHistory
      summary: Read allocation snapshots, newest first, from the shared demo registry
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, minLength: 1, maxLength: 100 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
        - name: cursor
          in: query
          description: Opaque nextCursor from the preceding page. Ordering is createdAt descending, then ID descending.
          schema: { type: string, minLength: 1, maxLength: 100 }
      responses:
        "200":
          description: Changes recorded since history tracking began; no historical identities are inferred
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PackagingAllocationHistoryPage"
        "400": { description: "Invalid batch ID, limit, or cursor" }
        "404": { description: Batch not found }
  /packaging/teams:
    get:
      operationId: listEvidenceTeams
      responses:
        "200":
          description: Teams approved for the current account
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/EvidenceTeam" } }
    post:
      operationId: createEvidenceTeam
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EvidenceTeamInput" }
      responses:
        "201":
          description: Owner-managed team created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EvidenceTeam" }
  /packaging/teams/{teamId}/members/{userId}:
    parameters:
      - { name: teamId, in: path, required: true, schema: { type: string } }
      - { name: userId, in: path, required: true, schema: { type: string } }
    put:
      operationId: approveEvidenceMember
      responses:
        "204": { description: Member approved by team owner }
    delete:
      operationId: revokeEvidenceMember
      responses:
        "204": { description: Membership revoked by team owner }
  /packaging/batches/{batchId}/documents/{documentId}/sharing:
    parameters:
      - { name: batchId, in: path, required: true, schema: { type: string } }
      - { name: documentId, in: path, required: true, schema: { type: string } }
    patch:
      operationId: updateEvidenceSharing
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EvidenceSharingInput" }
      responses:
        "200":
          description: Sharing updated by uploader
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PackagingDocument" }
  /auth/user:
    get:
      operationId: getCurrentAuthUser
      responses:
        "200":
          description: Current session
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthUserEnvelope" }
  /login:
    get:
      operationId: beginBrowserLogin
      parameters:
        - { name: returnTo, in: query, schema: { type: string } }
      responses:
        "302": { description: OIDC redirect }
  /callback:
    get:
      operationId: handleBrowserLoginCallback
      responses:
        "302": { description: Return to app }
  /logout:
    get:
      operationId: logoutBrowserSession
      responses:
        "302": { description: Logout redirect }
  /mobile-auth/token-exchange:
    post:
      operationId: exchangeMobileAuthorizationCode
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MobileTokenExchangeRequest" }
      responses:
        "200":
          description: Session
          content:
            application/json:
              schema: { type: object, required: [token], properties: { token: { type: string } } }
  /mobile-auth/logout:
    post:
      operationId: logoutMobileSession
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema: { type: object, required: [success], properties: { success: { type: boolean } } }
  /packaging/batches/{batchId}/documents:
    parameters:
      - { name: batchId, in: path, required: true, schema: { type: string, minLength: 1, maxLength: 100 } }
    get:
      operationId: listPackagingDocuments
      summary: List the signed-in uploader's evidence for this batch
      responses:
        "200":
          description: Uploaded evidence, not verified certification
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/PackagingDocument" } }
        "401": { description: Login required }
        "404": { description: Batch not found }
        "503": { description: Documents unavailable }
    post:
      operationId: uploadPackagingDocument
      summary: Upload PDF, PNG or JPEG evidence, up to 10 MiB, without changing compliance status
      parameters:
        - { name: x-document-name, in: header, required: true, description: URI-encoded original filename, schema: { type: string, minLength: 1, maxLength: 1620 } }
        - { name: x-document-kind, in: header, required: true, schema: { type: string, enum: [supplier_declaration, migration_report, inspection_report] } }
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        "201":
          description: Stored document
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PackagingDocument" }
        "400": { description: Invalid file or metadata }
        "401": { description: Login required }
        "403": { description: Cross-origin write rejected }
        "404": { description: Batch not found }
        "413": { description: File exceeds 10 MiB }
        "429": { description: "Upload capacity reached, retry later" }
        "503": { description: "Upload failed, retry" }
  /packaging/batches/{batchId}/documents/{documentId}/download:
    get:
      operationId: downloadPackagingDocument
      parameters:
        - { name: batchId, in: path, required: true, schema: { type: string, minLength: 1, maxLength: 100 } }
        - { name: documentId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Original file as an attachment, uploader access only
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "401": { description: Login required }
        "404": { description: Document not found or unavailable to this user }
        "423": { description: Quarantined pending a successful malware scan }
        "503": { description: Download unavailable }
  /packaging/batches:
    get:
      operationId: listPackagingBatches
      responses:
        "200":
          description: Packaging material batches
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PackagingBatch" }
    post:
      operationId: createPackagingBatch
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PackagingBatchInput" }
      responses:
        "201":
          description: Created material batch
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PackagingBatch" }
  /packaging/batches/{id}:
    put:
      operationId: updatePackagingBatch
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PackagingBatchUpdate" }
      responses:
        "200":
          description: Updated material batch
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PackagingBatch" }
        "400": { description: Invalid or missing updatedAt precondition }
        "404": { description: Material batch not found }
        "409":
          description: Stale edit or duplicate lot ID; stale edits include the current record
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PackagingBatchConflict" }
  /packaging/search:
    post:
      operationId: searchPackagingTrace
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PackagingSearchInput" }
      responses:
        "200":
          description: AI answer grounded in current batch records
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PackagingSearchResult" }
  /quality-email-settings:
    get:
      operationId: getQualityEmailSettings
      responses:
        "200":
          description: Configured notification recipient for signed-in staff
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QualityEmailSettings"
  /quality-actions:
    get:
      operationId: listQualityActions
      responses:
        "200":
          description: Recorded internal decisions
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/QualityAction" }
    post:
      operationId: recordQualityAction
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/QualityActionInput" }
      responses:
        "200":
          description: Recorded decision
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QualityAction" }
  /quality-actions/{requestId}:
    delete:
      operationId: deleteQualityAction
      parameters:
        - in: path
          name: requestId
          required: true
          schema: { type: string, minLength: 1, maxLength: 100 }
      responses:
        "204":
          description: Selected decision deleted
        "404":
          description: Decision not found
  /trace:
    get:
      operationId: getTrace
      parameters:
        - in: query
          name: search
          schema: { type: string }
      responses:
        "200":
          description: Material trace with production and distribution
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Trace"
  /runs/{id}:
    patch:
      operationId: updateRun
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RunUpdate"
      responses:
        "200":
          description: Updated run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Run"
  /runs/{id}/destinations:
    post:
      operationId: addDestination
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DestinationInput" }
      responses:
        "200":
          description: Updated batch with added destination
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Run" }
  /runs/{id}/destinations/{index}:
    delete:
      operationId: deleteDestination
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
        - in: path
          name: index
          required: true
          schema: { type: integer, minimum: 0 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DestinationDeleteInput"
      responses:
        "200":
          description: Updated batch after removing the selected destination and quantity
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Run" }
        "409":
          description: Destinations changed; reload and select the row again
        "404":
          description: Batch or destination not found
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
components:
  schemas:
    QualityEmailSettings:
      type: object
      required: [recipient, enabled]
      properties:
        recipient: { type: string }
        enabled: { type: boolean }
    DestinationDeleteInput:
      type: object
      required: [expectedQuantity, expectedDestinations]
      properties:
        expectedQuantity: { type: integer, minimum: 0 }
        expectedDestinations:
          type: array
          items: { $ref: "#/components/schemas/Destination" }
    PackagingScannerHealth:
      type: object
      required: [status, definitions, definitionsCheckedAt, lastCheckAt, lastSuccessAt, consecutiveFailures, queued, errors, oldestQueuedAt, aging]
      properties:
        status: { type: string, enum: [healthy, retrying, outage, blocked, unknown] }
        definitions: { type: string, enum: [current, stale, missing] }
        definitionsCheckedAt: { type: [string, "null"], format: date-time }
        lastCheckAt: { type: [string, "null"], format: date-time }
        lastSuccessAt: { type: [string, "null"], format: date-time }
        consecutiveFailures: { type: integer, minimum: 0 }
        queued: { type: integer, minimum: 0 }
        errors: { type: integer, minimum: 0 }
        oldestQueuedAt: { type: [string, "null"], format: date-time }
        aging: { type: boolean }
    PackagingAllocationHistoryPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/PackagingAllocationChange" }
        nextCursor:
          type: ["string", "null"]
          description: Pass as cursor to load older entries; null when there are no more.
    PackagingAllocationChange:
      type: object
      required: [id, batchId, lotId, before, after, createdAt, attribution]
      properties:
        id: { type: string }
        batchId: { type: string }
        lotId: { type: string }
        before:
          type: array
          items: { $ref: "#/components/schemas/PackagingAllocation" }
        after:
          type: array
          items: { $ref: "#/components/schemas/PackagingAllocation" }
        createdAt: { type: string, format: date-time }
        correctionReason:
          type: string
          nullable: true
          maxLength: 1000
          description: Optional human-entered reason for this allocation change; absent or null for older entries and edits without a reason.
        attribution:
          type: string
          enum: [shared_demo]
          description: Shared-demo edit, not an authenticated staff identity, even if the browser has an evidence-upload session
    PackagingAllocation:
      type: object
      description: Staff-recorded quantity from one finished lot to one customer/destination, scoped to this material trace. Not a shipment confirmation.
      required: [finishedLotId, customer, quantity, unit]
      properties:
        finishedLotId: { type: string, minLength: 1, maxLength: 100 }
        customer: { type: string, minLength: 1, maxLength: 200 }
        quantity: { type: number, exclusiveMinimum: 0, maximum: 1000000000 }
        unit: { type: string, enum: [pieces, kg, liters, rolls, sheets, cartons] }
    AuthUser:
      type: object
      required: [id, email, firstName, lastName, profileImageUrl]
      properties:
        id: { type: string }
        email: { type: [string, "null"] }
        firstName: { type: [string, "null"] }
        lastName: { type: [string, "null"] }
        profileImageUrl: { type: [string, "null"] }
    AuthUserEnvelope:
      type: object
      required: [user]
      properties:
        user:
          oneOf:
            - { $ref: "#/components/schemas/AuthUser" }
            - { type: "null" }
    MobileTokenExchangeRequest:
      type: object
      required: [code, code_verifier, redirect_uri, state]
      properties:
        code: { type: string, minLength: 1 }
        code_verifier: { type: string, minLength: 1 }
        redirect_uri: { type: string, minLength: 1, format: uri }
        state: { type: string, minLength: 1 }
        nonce: { type: string, minLength: 1 }
    EvidenceAccessHistory:
      type: object
      required: [items, nextBefore]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/EvidenceAccessChange" } }
        nextBefore: { type: [integer, "null"] }
    EvidenceAccessChange:
      type: object
      required: [id, actorId, createdAt, action, memberId, previousTeamId, nextTeamId]
      properties:
        id: { type: integer }
        actorId: { type: string }
        createdAt: { type: string, format: date-time }
        action: { type: string, enum: [member_approved, member_removed, sharing_changed] }
        memberId: { type: [string, "null"] }
        previousTeamId: { type: [string, "null"] }
        nextTeamId: { type: [string, "null"] }
    EvidenceTeamInput:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
    EvidenceSharingInput:
      type: object
      required: [sharedTeamId]
      properties:
        sharedTeamId: { type: [string, "null"] }
    EvidenceTeam:
      type: object
      required: [id, name, isOwner, members]
      properties:
        id: { type: string }
        name: { type: string }
        isOwner: { type: boolean }
        members: { type: array, items: { type: string } }
    PackagingDocument:
      type: object
      required: [id, batchId, kind, name, contentType, size, createdAt, sharedTeamId, canManage, scanStatus, scannedAt]
      properties:
        scanStatus: { type: string, enum: [pending, clean, rejected, scan_error] }
        scannedAt: { type: [string, "null"], format: date-time }
        sharedTeamId: { type: [string, "null"] }
        canManage: { type: boolean }
        id: { type: string }
        batchId: { type: string }
        kind: { type: string, enum: [supplier_declaration, migration_report, inspection_report] }
        name: { type: string }
        contentType: { type: string }
        size: { type: integer }
        createdAt: { type: string, format: date-time }
    PackagingBatchUpdate:
      allOf:
        - $ref: "#/components/schemas/PackagingBatchInput"
        - type: object
          required: [expectedUpdatedAt]
          properties:
            correctionReason:
              type: string
              maxLength: 1000
              description: Optional reason saved only when allocations change. Whitespace-only input is treated as no reason.
            expectedUpdatedAt:
              type: string
              format: date-time
              description: updatedAt from the record the editor last reviewed
    PackagingBatchConflict:
      type: object
      required: [error]
      properties:
        error: { type: string }
        code: { type: string, enum: [EDIT_CONFLICT] }
        current: { $ref: "#/components/schemas/PackagingBatch" }
    PackagingBatchInput:
      type: object
      required: [lotId, category, materialName, supplierName, supplierCountry, supplierContact, quantity, unit, status, complianceStatus, documentRef, complianceNotes, finishedBatches, destinations]
      properties:
        lotId: { type: string, minLength: 1, maxLength: 100 }
        category: { type: string, enum: [ink, adhesive, coating, raw_material] }
        materialName: { type: string, minLength: 1, maxLength: 200 }
        supplierName: { type: string, minLength: 1, maxLength: 200 }
        supplierCountry: { type: string, maxLength: 100 }
        supplierContact: { type: string, maxLength: 200 }
        quantity: { type: number, minimum: 0, maximum: 1000000000 }
        unit: { type: string, enum: [kg, liters, rolls, sheets] }
        status: { type: string, enum: [pending, released, hold] }
        complianceStatus: { type: string, enum: [pending, documented, review_required] }
        documentRef: { type: string, maxLength: 300 }
        complianceNotes: { type: string, maxLength: 3000 }
        finishedBatches:
          type: array
          maxItems: 100
          items: { type: string, minLength: 1, maxLength: 100 }
        destinations:
          type: array
          maxItems: 100
          items: { type: string, minLength: 1, maxLength: 200 }
        allocations:
          description: Exact allocations; omitted on update preserves existing entries. Empty array explicitly clears entries. Aggregate links remain independent and unallocated.
          type: array
          maxItems: 100
          items: { $ref: "#/components/schemas/PackagingAllocation" }
    PackagingBatch:
      allOf:
        - $ref: "#/components/schemas/PackagingBatchInput"
        - type: object
          required: [id, demo, updatedAt]
          properties:
            id: { type: string }
            demo: { type: boolean }
            updatedAt: { type: string }
    PackagingSearchInput:
      type: object
      required: [query]
      properties:
        query: { type: string, minLength: 1, maxLength: 1500 }
    PackagingSearchResult:
      type: object
      required: [answer, batchIds]
      properties:
        answer: { type: string }
        batchIds:
          type: array
          items: { type: string }
    ChecklistEntry:
      type: object
      required: [label, result, notes]
      properties:
        label: { type: string, minLength: 1, maxLength: 200 }
        result: { type: string, enum: [pending, passed, failed] }
        notes: { type: string, maxLength: 2000 }
    QualityActionInput:
      type: object
      required: [requestId, action, batchIds, rationale]
      properties:
        requestId: { type: string, minLength: 1, maxLength: 100 }
        action: { type: string, enum: [recall, release] }
        batchIds:
          type: array
          minItems: 1
          maxItems: 100
          items: { type: string }
        rationale: { type: string, minLength: 1, maxLength: 5000 }
    QualityAction:
      type: object
      required: [requestId, action, batchIds, rationale, createdAt, quantity]
      properties:
        emailStatus: { type: string, enum: [not_requested, queued, sending, sent, failed, unknown] }
        emailRecipient: { type: string }
        emailError: { type: string }
        emailSentAt: { type: string }
        requestId: { type: string }
        action: { type: string, enum: [recall, release] }
        batchIds:
          type: array
          items: { type: string }
        rationale: { type: string }
        createdAt: { type: string }
        quantity: { type: integer }
    Trace:
      type: object
      required: [materials, runs]
      properties:
        materials:
          type: array
          items: { $ref: "#/components/schemas/Material" }
        runs:
          type: array
          items: { $ref: "#/components/schemas/Run" }
    Material:
      type: object
      required: [id, supplier, name, alert]
      properties:
        id: { type: string }
        supplier: { type: string }
        name: { type: string }
        alert: { type: string }
    Run:
      type: object
      required: [id, materialId, quantity, inkLot, inspectionResult, releaseDecision, qualityNotes, updatedAt, destinations, checklist]
      properties:
        id: { type: string }
        materialId: { type: string }
        quantity: { type: integer }
        inkLot: { type: string }
        checklist:
          type: array
          items: { $ref: "#/components/schemas/ChecklistEntry" }
        inspectionResult: { type: string, enum: [pending, passed, failed] }
        releaseDecision: { type: string, enum: [pending, released, hold, rejected] }
        qualityNotes: { type: string }
        updatedAt: { type: string }
        destinations:
          type: array
          items: { $ref: "#/components/schemas/Destination" }
    Destination:
      type: object
      required: [name, quantity, type]
      properties:
        id: { type: string }
        inspectionResult: { type: string, enum: [pending, passed, failed] }
        name: { type: string }
        quantity: { type: integer }
        type: { type: string, enum: [shipped, inventory] }
    DestinationInput:
      type: object
      required: [requestId, name, quantity, type, confirmedPassed]
      properties:
        requestId: { type: string, minLength: 1, maxLength: 100 }
        name: { type: string, minLength: 1, maxLength: 200 }
        quantity: { type: integer, minimum: 1, maximum: 1000000000 }
        type: { type: string, enum: [shipped, inventory] }
        confirmedPassed: { type: boolean, enum: [true] }
    RunUpdate:
      type: object
      required: [inkLot, inspectionResult, releaseDecision, qualityNotes]
      properties:
        checklist:
