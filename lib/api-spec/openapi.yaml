openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
paths:
  /quality-actions:
    get:
      operationId: listQualityActions
      responses:
        "200":
          description: Recorded internal decisions
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/QualityAction" }
    post:
      operationId: recordQualityAction
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/QualityActionInput" }
      responses:
        "200":
          description: Recorded decision
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QualityAction" }
  /trace:
    get:
      operationId: getTrace
      parameters:
        - in: query
          name: search
          schema: { type: string }
      responses:
        "200":
          description: Material trace with production and distribution
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Trace"
  /runs/{id}:
    patch:
      operationId: updateRun
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RunUpdate"
      responses:
        "200":
          description: Updated run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Run"
  /runs/{id}/destinations:
    post:
      operationId: addDestination
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DestinationInput" }
      responses:
        "200":
          description: Updated batch with added destination
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Run" }
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
components:
  schemas:
    ChecklistEntry:
      type: object
      required: [label, result, notes]
      properties:
        label: { type: string, minLength: 1, maxLength: 200 }
        result: { type: string, enum: [pending, passed, failed] }
        notes: { type: string, maxLength: 2000 }
    QualityActionInput:
      type: object
      required: [requestId, action, batchIds, rationale]
      properties:
        requestId: { type: string, minLength: 1, maxLength: 100 }
        action: { type: string, enum: [recall, release] }
        batchIds:
          type: array
          minItems: 1
          maxItems: 100
          items: { type: string }
        rationale: { type: string, minLength: 1, maxLength: 5000 }
    QualityAction:
      type: object
      required: [requestId, action, batchIds, rationale, createdAt, quantity]
      properties:
        requestId: { type: string }
        action: { type: string, enum: [recall, release] }
        batchIds:
          type: array
          items: { type: string }
        rationale: { type: string }
        createdAt: { type: string }
        quantity: { type: integer }
    Trace:
      type: object
      required: [materials, runs]
      properties:
        materials:
          type: array
          items: { $ref: "#/components/schemas/Material" }
        runs:
          type: array
          items: { $ref: "#/components/schemas/Run" }
    Material:
      type: object
      required: [id, supplier, name, alert]
      properties:
        id: { type: string }
        supplier: { type: string }
        name: { type: string }
        alert: { type: string }
    Run:
      type: object
      required: [id, materialId, quantity, inkLot, inspectionResult, releaseDecision, qualityNotes, updatedAt, destinations, checklist]
      properties:
        id: { type: string }
        materialId: { type: string }
        quantity: { type: integer }
        inkLot: { type: string }
        checklist:
          type: array
          items: { $ref: "#/components/schemas/ChecklistEntry" }
        inspectionResult: { type: string, enum: [pending, passed, failed] }
        releaseDecision: { type: string, enum: [pending, released, hold, rejected] }
        qualityNotes: { type: string }
        updatedAt: { type: string }
        destinations:
          type: array
          items: { $ref: "#/components/schemas/Destination" }
    Destination:
      type: object
      required: [name, quantity, type]
      properties:
        id: { type: string }
        inspectionResult: { type: string, enum: [pending, passed, failed] }
        name: { type: string }
        quantity: { type: integer }
        type: { type: string, enum: [shipped, inventory] }
    DestinationInput:
      type: object
      required: [requestId, name, quantity, type, confirmedPassed]
      properties:
        requestId: { type: string, minLength: 1, maxLength: 100 }
        name: { type: string, minLength: 1, maxLength: 200 }
        quantity: { type: integer, minimum: 1, maximum: 1000000000 }
        type: { type: string, enum: [shipped, inventory] }
        confirmedPassed: { type: boolean, enum: [true] }
    RunUpdate:
      type: object
      required: [inkLot, inspectionResult, releaseDecision, qualityNotes]
      properties:
        checklist:
          type: array
          maxItems: 100
          items: { $ref: "#/components/schemas/ChecklistEntry" }
        inkLot: { type: string, maxLength: 100 }
        inspectionResult: { type: string, enum: [pending, passed, failed] }
        releaseDecision: { type: string, enum: [pending, released, hold, rejected] }
        qualityNotes: { type: string, maxLength: 5000 }
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

